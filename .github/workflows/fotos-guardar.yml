name: Guardar fotografias de maior qualidade no catálogo
on:
  workflow_dispatch:
    inputs:
      lado:
        description: "Tamanho máximo em píxeis (lado maior)"
        required: false
        default: "800"
      limite:
        description: "Só os primeiros N (teste). Vazio = todas"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  guardar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Preparar
        run: pip install pillow
      - name: Descarregar e guardar
        env:
          LADO: ${{ github.event.inputs.lado }}
          LIMITE: ${{ github.event.inputs.limite }}
        run: python3 fonte/fotos_guardar.py
      - name: Reconstruir o catálogo
        run: python3 fonte/construir.py || echo "Reconstrução adiada para a atualização diária"
      - name: Publicar
        run: |
          git config user.name "catalogo-bot"
          git config user.email "catalogo-bot@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then echo "Nada a publicar"; exit 0; fi
          git add -A
          git commit -q -m "Fotografias de maior qualidade guardadas no catálogo"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done; exit 1
